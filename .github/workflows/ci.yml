name: tests

# The datasets are hundreds of megabytes and belong to their authors, so CI does
# not download them. The unit tests need no data; the one test that reads a real
# CORD receipt skips itself when the shards are absent.
#
# Every step below is a single command. Earlier versions of this file used a
# shell heredoc to run a few lines of Python inline, which stacks YAML, bash and
# Python quoting on top of each other. The job failed with bash's syntax-error
# exit code while the project itself built and tested cleanly on Linux, and the
# logs are not readable without signing in, so the cause was invisible. Anything
# longer than one command now lives in a script under scripts/ that can be run
# locally in the same form.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report the environment
        run: python scripts/report_env.py

      - name: Run tests
        run: pytest tests/ -q --continue-on-collection-errors -rf

      - name: Confirm the rupee guardrail refuses an unbacked amount
        run: python scripts/check_guardrail.py
