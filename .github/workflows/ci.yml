name: tests

# The datasets are hundreds of megabytes and belong to their authors, so CI does
# not download them. It runs the unit tests, which are written to need no data,
# and checks that the service starts and answers. The benchmarks are run on a
# developer machine and their output is committed under results/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # We pin opencv-python-headless, which needs no display libraries, but
      # rapidocr-onnxruntime depends on the full opencv-python and pip installs
      # it alongside. Whichever lands last provides cv2, so the runner needs the
      # system libraries the full build links against or `import cv2` fails with
      # libGL.so.1 and pytest exits during collection. The Dockerfile installs
      # the same two packages for the same reason.
      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show what is installed
        run: |
          python -c "import cv2, sys; print('cv2', cv2.__version__, 'on', sys.version)"
          pip list

      - name: Run tests
        run: pytest -q

      - name: Check the service starts and answers
        run: |
          uvicorn stockmate.api.app:app --port 8000 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/dashboard > /dev/null
          curl -fsS "http://127.0.0.1:8000/api/plan?budget=15000" > /dev/null

      - name: Confirm the rupee guardrail is active
        run: |
          python - <<'PY'
          from stockmate.models import Finding
          from stockmate.money import Money
          from stockmate.store.ledger import InMemoryLedger, UnbackedAmountError, verify_finding

          unbacked = Finding(finding_id="x", kind="k", title="t", detail="d",
                             amount=Money.from_rupees("100.00"))
          try:
              verify_finding(unbacked, InMemoryLedger())
          except UnbackedAmountError:
              print("guardrail active: an unbacked amount was refused")
          else:
              raise SystemExit("guardrail did not fire; an amount could reach an owner unbacked")
          PY
